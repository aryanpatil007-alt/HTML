<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Registered? Login to Your Account</title>
    <link rel="stylesheet" href="./static/already.css">
</head>

<body>

    <h1>Already Registered?</h1>

    <h2>Login to Your Account</h2>

    <p>Welcome back! Please enter your details below.</p>
    
    <hr>

    <form action="./registration_success.html">

        <!-- Email, password, forgot password, login -->

        <div class="form-group">

            <label for="email"><b>Email</b></label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >
            <label for="password"><b>Password</b></label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                minlength="8"
                maxlength="16"
                required
            >
             <a href="./forget.html" class="forgot-password">
                Forgot Password?
            </a>
            <a href="./registration_success.html" class="login-button">
                Login
             </a>

        </div>            
    </form>

    <hr>
    <!-- Create Account -->

    <p>Don't have an account?</p>

    <a href="./register.html" class="create-account">
        Create New Account
    </a>

</body>
</html>
