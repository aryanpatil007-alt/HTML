<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registeration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="./registration_success.html">
    <h2 id="student-id">Students Registeration Portal</h2>
    <br>
    <b>Register Your Account</b>
    <br><br>

    <input id="class1" type="text" maxlength="12" size="20" placeholder="First Name:" required>
    <br><br>

    <input id="class2" type="text" maxlength="12" size="20" placeholder="last Name:" required>
    <br><br> 

    <input id="class3" type="email" placeholder="Enter Email:" required>
    <br><br>

    <input id="class4" type="password" placeholder="Enter password" minlength="8" maxlength="10" required>
    <br><br>

    <a href="./forget.html">
        <button type="button" size="2"> forget password</button>
    </a>

    <br><br>

    <label><b>Date of Birth:</b></label>
    <input type="date" maxlength="2026-01-01" placeholder="Date of Birth" required>
<br><br>

<label for="country"><b>Select Country:</b></label>

<select id="country" name="country" required>
    <option value="">Choose Country:</option>
    <option>India</option>
    <option>USA</option>
    <option>United Kingdom</option>
    <option>Canada</option>
    <option>Australia</option>
</select>
<br><br>

<label for="City"><b>City:</b></label>
    <select name="City" id="City" required>
        <option required>Select City</option>
        <option required>Mumbai</option>
        <option required>Pune</option>
        <option required>Bangalore</option>
    </select>
<br><br>

    <textarea name="feedback" id="feedbackBox" placeholder="You can give your feedback here" rows="3" columns="5"></textarea>
    <input id="register-button" type="submit" value="Register">
<br><br>
    </form>

<hr>
<label>
    <input id="terms" type="checkbox" required> <b>I agree to all terms and Conditions</b>
</label>

    <footer>
        <h4>© 2026 Vertex Solutions
        Privacy Policy
        Terms & Conditions
        Contact Us</h4>
    </footer>


</body>
</html>
